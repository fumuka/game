<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>円を増やすゲーム</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3efe4;--card:#fffdf6;--ink:#2a2619;--sub:#7a7360;--line:#e3dcc7;--acc:#c8891a;--acc2:#2f7d5b;--btn:#2a2619;--btnt:#fffdf6;--bar:#e9e2cc;--bad:#b4442f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1c1a14;--card:#27241b;--ink:#f1ead6;--sub:#a39b83;--line:#3a3628;--acc:#e8b04a;--acc2:#5fc08f;--btn:#f1ead6;--btnt:#1c1a14;--bar:#38342a;--bad:#e8806b}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;line-height:1.5}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
main{max-width:720px;margin:0 auto;padding:12px}
.top{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.st small{color:var(--sub);font-size:12px}.st b{display:block;font-size:clamp(14px,4.4vw,18px);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.big b{font-size:clamp(16px,5vw,22px);color:var(--acc)}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
nav button{flex:none;white-space:nowrap;padding:9px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:16px}
.bar{height:12px;background:var(--bar);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0;border-radius:99px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:180px;overflow-wrap:anywhere}.row .t small{display:block;color:var(--sub);font-size:12px}
.bt{display:flex;gap:4px;flex-wrap:wrap}
button.b{padding:8px 12px;border:0;border-radius:10px;background:var(--btn);color:var(--btnt);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
button.b:disabled{opacity:.35;cursor:not-allowed}
button.b.alt{background:var(--bar);color:var(--ink)}
button.b.sell{background:var(--bad);color:#fff}
button.b.on{background:var(--acc2);color:#fff}
input{font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:150px}
#coin{display:block;margin:6px auto;width:170px;height:170px;border-radius:50%;border:6px solid var(--acc);background:radial-gradient(circle at 35% 30%,#ffe9a6,#e8b04a);font-size:64px;cursor:pointer;box-shadow:0 5px 0 #a8730f;transition:transform .06s,box-shadow .06s;-webkit-touch-callout:none}
#coin:active{transform:translateY(4px);box-shadow:0 1px 0 #a8730f}
#coin.fv{border-color:#d9432b;animation:fvp .4s infinite alternate}
@keyframes fvp{to{transform:scale(1.05)}}
.c{text-align:center}.up{color:var(--acc2)}.down{color:var(--bad)}
#log{font-size:13px;color:var(--sub);max-height:180px;overflow:auto;margin:0;padding:0;list-style:none}
#log li{padding:2px 0}
.lock{opacity:.5}
.rl{font-size:30px;letter-spacing:6px;margin-top:2px}
.cflip{font-size:64px;text-align:center}.cflip.spin{animation:cs .35s linear infinite}
@keyframes cs{to{transform:rotateY(360deg)}}
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:70}
.toast{background:var(--btn);color:var(--btnt);padding:10px 16px;border-radius:12px;font-size:14px;max-width:92%;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:ti .25s}
@keyframes ti{from{transform:translateY(-16px);opacity:0}}
.pop{position:fixed;pointer-events:none;font-weight:700;color:var(--acc);animation:fl .7s forwards}
@keyframes fl{to{transform:translateY(-40px);opacity:0}}
.fxb{position:fixed;left:50%;top:38%;font-weight:900;pointer-events:none;z-index:60;white-space:nowrap;text-shadow:0 3px 0 rgba(0,0,0,.35);animation:p2 1.6s forwards}
.fxb.l1{font-size:32px;color:#ffd54a}.fxb.l2{font-size:44px;color:#ff9f1a}.fxb.l3{font-size:clamp(34px,10vw,56px);color:#ff4d6d;animation-duration:2.4s}
@keyframes p2{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}15%{transform:translate(-50%,-50%) scale(1.3);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
.cf{position:fixed;top:-30px;font-size:24px;pointer-events:none;z-index:55;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(112vh) rotate(720deg)}}
.flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:54;animation:fh .5s forwards}
@keyframes fh{0%{opacity:.85}100%{opacity:0}}
body.shake{animation:sk .5s}
@keyframes sk{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(4px,-2px)}}
@media (prefers-reduced-motion:reduce){.pop,.toast,.fxb,.flash,.cflip.spin,body.shake,#coin.fv{animation:none}.cf{display:none}}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
</style>
</head>
<body>
<div id="toasts"></div>
<main>
<div class="top">
<div class="st big"><small>💰 所持金</small><b id="tMoney"></b></div>
<div class="st"><small>📈 1日の収入</small><b id="tInc"></b></div>
<div class="st big"><small>🏦 総資産</small><b id="tAsset"></b></div>
<div class="st"><small>📅 経過日数</small><b id="tDay"></b></div>
</div>
<nav id="nav"></nav>
<section id="panel"></section>
</main>

const HS=[{k:'inc',n:'副業・事業・株収入 ×2',e:'💹',c:1,max:999},{k:'luck',n:'カジノの当たる確率 +10%（最大+20%）',e:'🍀',c:1,max:2},{k:'fev',n:'フィーバーの連打 +10回/秒',e:'🔥',c:1,max:999},{k:'day',n:'1日を0.5秒短縮（最大1秒）',e:'⏩',c:2,max:2}];
const U=['','万','億','兆','京','垓','秭','穣','溝','澗','正','載','極'];
function fmt(n){
 n=Math.floor(n);if(!isFinite(n))return '∞円';if(!(n>0))return '0円';if(n<1e4)return n+'円';
 const s=BigInt(n).toString(),g=[];for(let i=s.length;i>0;i-=4)g.unshift(s.slice(Math.max(0,i-4),i));
 const u=g.length-1;if(u>=U.length)return n.toExponential(2)+'円';
 let o=Number(g[0])+U[u];if(Number(g[1])>0)o+=Number(g[1])+U[u-1];return o+'円'}

const adMul=()=>isYT()?Math.max(.1,S.ads.reduce((a,x)=>a*(1+x.m),1)):1;

function fx(l,t){
 if(l<1)return;
 const d=document.createElement('div');d.className='fxb l'+l;d.textContent=t||['','当たり！','大当たり！！','🎉 JACKPOT 🎉'][l];document.body.appendChild(d);setTimeout(()=>d.remove(),2600);
 const n=[0,10,40,90][l],E=['🎉','✨','💰','🪙','⭐','💎','🎊'];
 for(let i=0;i<n;i++){const c=document.createElement('div');c.className='cf';c.textContent=E[Math.random()*E.length|0];c.style.left=Math.random()*100+'vw';c.style.animationDuration=(1.4+Math.random()*1.8)+'s';c.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3800)}
 if(l>=2){const f=document.createElement('div');f.className='flash';document.body.appendChild(f);setTimeout(()=>f.remove(),600)}
 if(l>=3){document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),600)}
}
const lvl=(p,b)=>{const x=p/b;return p<=b?0:x>=20?3:x>=5?2:1};
const SYM=['🍒','🍋','🔔','⭐','7️⃣'],MUL=[3,5,10,20,50],RED=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36],face=n=>({1:'A',11:'J',12:'Q',13:'K'}[n]||n);
const lk=f=>{let o=f();if(o.p<=0&&Math.random()<luck())o=f();return o};
function rollSlot(b){const r=[0,0,0].map(()=>Math.random()*5|0);let p=0;if(r[0]===r[1]&&r[1]===r[2])p=b*MUL[r[0]];else if(r[0]===r[1]||r[1]===r[2]||r[0]===r[2])p=Math.floor(b*.5);return{r,p}}
function slot(bet){
 if(slotBusy[bet]||S.money<bet)return;S.money-=bet;S.st.casino++;slotBusy[bet]=1;
 const iv=setInterval(()=>{slotShow[bet]=[0,0,0].map(()=>SYM[Math.random()*5|0]).join('');const e=$('rl'+bet);if(e)e.textContent=slotShow[bet]},70);
 render();
 setTimeout(()=>{clearInterval(iv);const o=lk(()=>rollSlot(bet));slotBusy[bet]=0;
  S.money+=o.p;slotShow[bet]=o.r.map(x=>SYM[x]).join('');if(o.r[0]===4&&o.r[1]===4&&o.r[2]===4)S.fl.jack=1;if(o.p>=1e5)S.fl.big=1;
  slotMsg[bet]=o.p>bet?'当たり！ +'+fmt(o.p-bet):o.p?'2つ揃い（'+fmt(o.p)+'戻り）':'ハズレ';
  const l=o.r[0]===4&&o.r[1]===4&&o.r[2]===4?3:lvl(o.p,bet);fx(l);render()},900);
}
function flip(g){
 if(coinBusy)return;const c=S.coin;
 if(!c.on){const b=Math.floor(Number($('bet').value));if(!(b>=1)||b>S.money){coinMsg='掛け金が正しくありません';return render()}
  S.money-=b;c.on=1;c.bet=b;c.pot=b;S.st.casino++;S.st.streak=0}
 coinBusy=true;coinMsg='コイントス…';render();
 setTimeout(()=>{coinBusy=false;let r=Math.random()<.5?'表':'裏',w=g===r;if(!w&&Math.random()<luck()){w=true}if(w)r=g;else r=g==='表'?'裏':'表';
  if(w){c.pot*=2;S.st.streak++;S.st.maxs=Math.max(S.st.maxs,S.st.streak);if(c.pot>=1e5)S.fl.big=1;coinMsg='「'+r+'」当たり！ 現在 '+fmt(c.pot);fx(S.st.streak>=5?3:S.st.streak>=3?2:1)}
  else{if(c.bet>=1e4)S.fl.lost=1;coinMsg='「'+r+'」ハズレ… 0円になりました';c.on=0;c.pot=0;S.st.streak=0}
  render()},700);

function chohan(k){const b=gbet();if(!b)return;const o=lk(()=>{const d=[1+Math.random()*6|0,1+Math.random()*6|0],s=d[0]+d[1],ev=s%2===0;return{d,s,ev,p:(k==='e')===ev?Math.floor(b*1.95):0}});settle(b,o.p,'🎲 '+o.d[0]+'＋'+o.d[1]+'＝'+o.s+'（'+(o.ev?'丁':'半')+'）')}

 const o=lk(()=>{const n=1+(Math.random()*13|0),w=k==='h'?n>c:n<c;return{n,p:w?Math.floor(b*.95/p):0}});hlCard=o.n;settle(b,o.p,'🃏 '+face(c)+' → '+face(o.n))}
function lottery(){const b=300;if(S.money<b){gmsg='所持金が足りません';return render()}S.money-=b;S.st.casino++;
 const o=lk(()=>{const r=Math.random();return r<.00005?{p:1e6,m:'1等 100万円！'}:r<.00205?{p:1e4,m:'2等 1万円'}:r<.02205?{p:1000,m:'3等 1,000円'}:r<.12205?{p:300,m:'4等 300円'}:{p:0,m:'ハズレ'}});settle(b,o.p,'🎟️ '+o.m)}
function otherCard(){const c=hlCard,ph=(13-c)/13,pl=(c-1)/13,m=p=>p>0?'×'+(.95/p).toFixed(2):'不可';
return `<div class="card"><h3>🎲 その他のカジノ</h3><div class="bt" style="align-items:center;margin-bottom:8px"><input type="number" inputmode="numeric" min="1" value="${lastBet}" oninput="lastBet=this.value" placeholder="掛け金（円）"><small style="color:var(--sub)">共通の掛け金</small></div>

<div class="row"><div class="t">🃏 ハイ＆ロー<small>今のカード：<b>${face(c)}</b>（1〜13）。同じ数字は負け。上 ${m(ph)}／下 ${m(pl)}</small></div><div class="bt"><button class="b" onclick="hilo('h')">上</button><button class="b" onclick="hilo('l')">下</button></div></div>
<div class="row"><div class="t">🎟️ 宝くじ<small>1枚300円。1等100万円（約0.005%）〜4等300円</small></div><button class="b" onclick="lottery()" ${S.money<300?'disabled':''}>買う</button></div>
<div style="font-size:14px;margin-top:8px">${gmsg}</div></div>`}
